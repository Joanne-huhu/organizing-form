<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>居家整理需求與問題諮詢問卷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --paper:#F5F0E6; --paper-2:#EFE8D8; --ink:#3A362E; --ink-soft:#6B6455;
  --moss:#79876A; --clay:#BD7F5C; --line:#DDD3BC; --card:#FBF8F2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#F5F0E6; --ink:#3A362E; }
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Noto Sans TC',sans-serif; line-height:1.75;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:720px; margin:0 auto; padding:56px 24px 100px;}
header.hero{text-align:center; margin-bottom:48px;}
.hero-art{width:100%; height:auto; max-width:560px; border-radius:20px; margin-bottom:24px; box-shadow:0 6px 18px rgba(120,100,60,.12);}
header.hero .kanji{font-family:'Zen Maru Gothic',serif; font-size:14px; letter-spacing:.5em; color:var(--moss); margin-bottom:14px;}
header.hero h1{font-family:'Zen Maru Gothic',serif; font-weight:700; font-size:30px; margin:0 0 12px; line-height:1.5;}
header.hero p{color:var(--ink-soft); font-size:14.5px; max-width:480px; margin:0 auto;}
.section{margin-bottom:52px;}
.section-head{display:flex; align-items:baseline; gap:14px; margin-bottom:22px; border-bottom:1px solid var(--line); padding-bottom:14px;}
.section-head .num{font-family:'Zen Maru Gothic',serif; font-size:26px; color:var(--clay);}
.section-head h2{font-family:'Zen Maru Gothic',serif; font-size:19px; font-weight:700; margin:0;}
.q{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:14px;}
.q-label{display:block; font-weight:500; margin-bottom:12px; font-size:15px;}
.opts{display:flex; flex-wrap:wrap; gap:10px 22px;}
.opts-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px 16px;}
.opts-grid .opt{white-space:nowrap;}
.opt{display:flex; align-items:center; gap:8px; font-size:14.5px; cursor:pointer; color:var(--ink-soft);}
.opt input{accent-color:var(--moss); width:16px; height:16px; cursor:pointer;}
.opt input:checked ~ span, .opt:has(input:checked) span{color:var(--ink); font-weight:500;}
.inline-input{border:none; border-bottom:1px solid var(--line); background:transparent; font-family:inherit; font-size:14px; padding:3px 6px; width:120px; color:var(--ink); border-radius:6px;}
.inline-input:focus{outline:none; border-color:var(--moss);}
.inline-input.wide{width:100%; margin-top:10px;}
.row3{display:flex; gap:14px; flex-wrap:wrap;}
.row3 .inline-input{width:80px;}
textarea.inline-input{width:100%; resize:vertical; min-height:40px; font-family:inherit;}
.priority{display:flex; gap:16px; margin-top:12px; flex-wrap:wrap;}
.priority span{font-size:13.5px; color:var(--ink-soft);}
.priority .inline-input{width:70px;}
.file-note{border:1px dashed var(--line); border-radius:16px; padding:16px; font-size:13.5px; color:var(--ink-soft); background:#FAF6EE;}
.cta-bar{position:sticky; bottom:0; background:linear-gradient(to top, var(--paper) 60%, transparent); padding:24px 0 14px; text-align:center;}
#genBtn{
  background:var(--moss); color:#fff; border:none; padding:15px 40px; font-size:15.5px;
  font-family:'Zen Maru Gothic',serif; letter-spacing:.15em; border-radius:999px; cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.12); transition:background .2s;
}
#genBtn:hover{background:#66735A;}
#genBtn:disabled{background:#B9B2A1; cursor:wait;}
.status{font-size:12.5px; color:var(--ink-soft); margin-top:10px; min-height:16px;}
#pdfPreview{position:fixed; left:-9999px; top:0; width:680px; background:#fff; color:#2A271F; padding:40px; font-family:'Noto Sans TC',sans-serif;}
#pdfPreview h1{font-family:'Zen Maru Gothic',serif; font-size:22px; text-align:center; margin-bottom:4px;}
#pdfPreview .sub{text-align:center; color:#8A8272; font-size:12px; margin-bottom:26px;}
#pdfPreview h2{font-family:'Zen Maru Gothic',serif; font-size:15px; border-bottom:1px solid #DDD3BC; padding-bottom:6px; margin:24px 0 12px;}
#pdfPreview .pq{margin-bottom:10px; font-size:12.5px;}
#pdfPreview .pq b{display:block; margin-bottom:2px;}
#pdfPreview .pq span{color:#4A463C;}
@media (max-width:480px){ .opts{gap:8px 16px;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <svg class="hero-art" viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="溫馨居家插畫">
      <rect x="0" y="0" width="640" height="190" rx="22" fill="#EFE6D4"/>
      <circle cx="500" cy="55" r="46" fill="#F1D9AE" opacity="0.7"/>
      <rect x="0" y="140" width="640" height="50" fill="#E6DAC0"/>
      <rect x="60" y="70" width="220" height="80" rx="10" fill="#D8CBA9"/>
      <rect x="60" y="70" width="220" height="10" rx="5" fill="#C7B98F"/>
      <rect x="60" y="115" width="220" height="8" fill="#C7B98F" opacity="0.6"/>
      <rect x="80" y="90" width="14" height="26" rx="2" fill="#8C7A54"/>
      <rect x="98" y="84" width="14" height="32" rx="2" fill="#A4885A"/>
      <rect x="116" y="94" width="14" height="22" rx="2" fill="#8C7A54"/>
      <g transform="translate(170,58)">
        <rect x="-6" y="34" width="34" height="24" rx="6" fill="#C97B5A"/>
        <path d="M11 34 C -14 34 -20 -6 11 4 C 42 -6 36 34 11 34 Z" fill="#79876A"/>
        <path d="M11 4 C 6 -14 16 -14 11 4 Z" fill="#647A57"/>
      </g>
      <g transform="translate(225,86)">
        <ellipse cx="12" cy="34" rx="20" ry="8" fill="#C9BB98"/>
        <path d="M-6 34 Q12 44 30 34 L26 8 Q12 0 -2 8 Z" fill="#EDE3CC"/>
        <path d="M-2 8 Q12 16 26 8" fill="none" stroke="#C9BB98" stroke-width="2"/>
      </g>
      <g transform="translate(360,60)">
        <path d="M0 90 L0 30 Q0 10 20 6 Q40 10 40 30 L40 90" fill="none" stroke="#8C7A54" stroke-width="6" stroke-linecap="round"/>
        <ellipse cx="20" cy="6" rx="24" ry="10" fill="#F6EAD0" stroke="#8C7A54" stroke-width="3"/>
      </g>
      <g transform="translate(430,120)">
        <circle cx="18" cy="18" r="18" fill="#B8935A" opacity="0.85"/>
        <circle cx="18" cy="18" r="7" fill="#FBF3E1"/>
      </g>
    </svg>
    <div class="kanji">整 理 相 談</div>
    <h1>居家整理需求與問題諮詢問卷</h1>
    <p>歡迎填寫這份問卷，讓我們更了解您的居住困擾與期待，為您打造專屬的整理計畫。</p>
  </header>

  <div class="section">
    <div class="section-head"><span class="num">一</span><h2>基本資訊與住宅現況</h2></div>
    <div class="q"><label class="q-label">填答人姓名／稱呼</label><input class="inline-input wide" data-q="姓名／稱呼"></div>
    <div class="q"><label class="q-label">聯絡電話／Line ID</label><input class="inline-input wide" data-q="聯絡方式"></div>
    <div class="q"><label class="q-label">住宅地點</label><input class="inline-input wide" data-q="住宅地點"></div>
    <div class="q"><label class="q-label">住宅型態</label>
      <div class="opts" data-q="住宅型態">
        <label class="opt"><input type="radio" name="house"><span>電梯大樓</span></label>
        <label class="opt"><input type="radio" name="house"><span>華廈／公寓（無電梯）</span></label>
        <label class="opt"><input type="radio" name="house"><span>透天厝／別墅</span></label>
        <label class="opt"><input type="radio" name="house"><span>套房</span></label>
      </div>
      <input class="inline-input wide" placeholder="若為華廈／公寓，請填樓層" data-extra>
    </div>
    <div class="q"><label class="q-label">居住成員與寵物</label>
      <div class="row3">
        <span>成人 <input class="inline-input" style="width:50px" data-q="成人人數"> 人</span>
        <span>兒童 <input class="inline-input" style="width:50px" data-q="兒童人數"> 人（年齡：<input class="inline-input" style="width:80px" data-q="兒童年齡">）</span>
      </div>
      <div class="opts" style="margin-top:12px" data-q="寵物">
        <label class="opt"><input type="checkbox"><span>無</span></label>
        <label class="opt"><input type="checkbox"><span>貓</span></label><input class="inline-input" style="width:50px" placeholder="幾隻" data-extra>
        <label class="opt"><input type="checkbox"><span>狗</span></label><input class="inline-input" style="width:50px" placeholder="幾隻" data-extra>
        <label class="opt"><input type="checkbox"><span>其他</span></label><input class="inline-input" style="width:100px" placeholder="請說明" data-extra>
      </div>
    </div>
    <div class="q"><label class="q-label">住宅坪數與格局</label>
      <div class="row3">
        約 <input class="inline-input" data-q="坪數"> 坪；
        <input class="inline-input" data-q="房"> 房
        <input class="inline-input" data-q="廳"> 廳
        <input class="inline-input" data-q="衛"> 衛
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head"><span class="num">二</span><h2>空間痛點與整理需求（核心）</h2></div>
    <div class="q"><label class="q-label">最想整理的區域（可複選）</label>
      <div class="opts opts-grid" data-q="最想整理的區域">
        <label class="opt"><input type="checkbox"><span>客廳／餐廳</span></label>
        <label class="opt"><input type="checkbox"><span>主臥室／衣櫃</span></label>
        <label class="opt"><input type="checkbox"><span>次臥／兒童房／玩具區</span></label>
        <label class="opt"><input type="checkbox"><span>廚房／冰箱</span></label>
        <label class="opt"><input type="checkbox"><span>陽台／儲藏室</span></label>
        <label class="opt"><input type="checkbox"><span>書房／工作桌</span></label>
        <label class="opt"><input type="checkbox"><span>全室整理</span></label>
      </div>
      <div class="priority">
        <span>優先順序 1. <input class="inline-input" data-extra></span>
        <span>2. <input class="inline-input" data-extra></span>
        <span>3. <input class="inline-input" data-extra></span>
      </div>
    </div>
    <div class="q"><label class="q-label">目前面臨的主要困擾（可複選）</label>
      <div class="opts" data-q="主要困擾">
        <label class="opt"><input type="checkbox"><span>物品太多，不知從何丟起／捨不得丟</span></label>
        <label class="opt"><input type="checkbox"><span>找不到東西，常常重複購買</span></label>
        <label class="opt"><input type="checkbox"><span>收納空間不夠／沒有合適的收納工具</span></label>
        <label class="opt"><input type="checkbox"><span>家人收納習慣不一致，整理完很快又亂</span></label>
        <label class="opt"><input type="checkbox"><span>生活動線不順，拿取物品不方便</span></label>
        <label class="opt"><input type="checkbox"><span>即將搬家</span></label>
        <label class="opt"><input type="checkbox"><span>剛經歷人生重大轉變</span></label>
        <label class="opt"><input type="checkbox"><span>其他</span></label>
      </div>
      <input class="inline-input wide" placeholder="其他，請說明" data-extra>
    </div>
  </div>

  <div class="section">
    <div class="section-head"><span class="num">三</span><h2>生活習慣與偏好</h2></div>
    <div class="q"><label class="q-label">平時清理與整理習慣</label>
      <div class="opts" data-q="整理習慣">
        <label class="opt"><input type="radio" name="habit"><span>有定期整理習慣，但效果不佳</span></label>
        <label class="opt"><input type="radio" name="habit"><span>完全沒時間整理，累積很久</span></label>
        <label class="opt"><input type="radio" name="habit"><span>只會把東西塞進櫃子眼不見為淨</span></label>
      </div>
    </div>
    <div class="q"><label class="q-label">對「斷捨離」的接受度</label>
      <div class="opts" data-q="斷捨離接受度">
        <label class="opt"><input type="radio" name="declutter"><span>高：希望大幅減少物品，打造極簡空間</span></label>
        <label class="opt"><input type="radio" name="declutter"><span>中：願意淘汰不需要的，保留回憶與實用物品</span></label>
        <label class="opt"><input type="radio" name="declutter"><span>偏低：保留大部分物品，重點在良好收納定位</span></label>
      </div>
    </div>
    <div class="q"><label class="q-label">喜好的視覺與收納風格（可複選）</label>
      <div class="opts" data-q="收納風格">
        <label class="opt"><input type="checkbox"><span>清楚可見（透明盒、開放架）</span></label>
        <label class="opt"><input type="checkbox"><span>隱藏式收納（門片櫃、抽屜）</span></label>
        <label class="opt"><input type="checkbox"><span>無印良品風</span></label>
        <label class="opt"><input type="checkbox"><span>日式極簡風（減少物品）</span></label>
        <label class="opt"><input type="checkbox"><span>好用好找最重要</span></label>
      </div>
    </div>
    <div class="q"><label class="q-label">衣服習慣收納方式</label>
      <div class="opts" data-q="衣服收納方式">
        <label class="opt"><input type="radio" name="house"><span>用衣架收納、不喜歡摺衣服</span></label>
        <label class="opt"><input type="radio" name="house"><span>習慣摺衣服方式</span></label>      
      </div>
        <input class="inline-input wide" placeholder="其他" data-extra>
    </div>
  </div>

  <div class="section">
    <div class="section-head"><span class="num">四</span><h2>服務期望與配合方式</h2></div>
    <div class="q"><label class="q-label">期待整理師協助的方式</label>
      <div class="opts" data-q="協助方式">
        <label class="opt"><input type="radio" name="help"><span>陪同一起動手整理，並學習收納技巧</span></label>
        <label class="opt"><input type="radio" name="help"><span>整理師引導決定去留，其餘全權操作</span></label>
        <label class="opt"><input type="radio" name="help"><span>提供線上諮詢或規劃建議即可</span></label>
      </div>
    </div>
    <div class="q"><label class="q-label">預期改善的主要目標（可複選）</label>
      <div class="opts" data-q="改善目標">
        <label class="opt"><input type="checkbox"><span>恢復乾淨整潔的居住環境</span></label>
        <label class="opt"><input type="checkbox"><span>建立家人都能維持的收納系統</span></label>
        <label class="opt"><input type="checkbox"><span>騰出空間（如兒童房、辦公空間）</span></label>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head"><span class="num">五</span><h2>預算、時間與現場評估</h2></div>
    <div class="q"><label class="q-label">預計施作時間點</label>
      <div class="opts" data-q="施作時間">
        <label class="opt"><input type="radio" name="time"><span>越快越好</span></label>
        <label class="opt"><input type="radio" name="time"><span>一個月內</span></label>
        <label class="opt"><input type="radio" name="time"><span>指定日期</span></label>
      </div>
      <input type="date" class="inline-input" data-extra>
    </div>
    <!--<div class="q"><label class="q-label">預計預算範圍</label>
      <div class="opts" data-q="預算範圍">
        <label class="opt"><input type="radio" name="budget"><span>1 萬元以下</span></label>
        <label class="opt"><input type="radio" name="budget"><span>1～3 萬元</span></label>
        <label class="opt"><input type="radio" name="budget"><span>3～5 萬元</span></label>
        <label class="opt"><input type="radio" name="budget"><span>5 萬元以上</span></label>
      </div>
    </div>
    -->
    <div class="q">
      <label class="q-label">現場照片／影片提供（關鍵評估依據）</label>
      <div class="file-note">請提供欲整理區域的現況照片（近照＋空間全景）或 15 秒短影片，供我們評估工時與報價。可於送出問卷後，另以 Email 或 Line 傳送檔案。</div>
      <input class="inline-input wide" placeholder="備註／檔案說明（選填）" data-q="照片影片備註" style="margin-top:10px">
    </div>
  </div>

  <div class="cta-bar">
    <button id="genBtn" onclick="generatePDF()">產生 PDF 並下載</button>
    <div class="status" id="status"></div>
  </div>
</div>

<div id="pdfPreview"></div>

<script>
function collect(){
  const sections = document.querySelectorAll('.section');
  const data = [];
  sections.forEach(sec=>{
    const title = sec.querySelector('h2').textContent;
    const num = sec.querySelector('.num').textContent;
    const items = [];
    sec.querySelectorAll('.q').forEach(q=>{
      const labelEl = q.querySelector('.q-label');
      if(!labelEl) return;
      const label = labelEl.textContent;
      let parts = [];
      q.querySelectorAll('input[type=checkbox]:checked, input[type=radio]:checked').forEach(inp=>{
        parts.push(inp.parentElement.querySelector('span').textContent);
      });
      q.querySelectorAll('input.inline-input, input[data-q], textarea, input[data-extra], input[type=date]').forEach(inp=>{
        if(inp.type==='checkbox'||inp.type==='radio') return;
        if(inp.value && inp.value.trim()) parts.push(inp.value.trim());
      });
      items.push({label, answer: parts.length? parts.join('、') : '（未填寫）'});
    });
    data.push({num, title, items});
  });
  return data;
}

function buildPreview(data){
  const el = document.getElementById('pdfPreview');
  let html = '<h1>居家整理需求與問題諮詢問卷</h1><div class="sub">填寫日期：'+new Date().toLocaleDateString('zh-TW')+'</div>';
  data.forEach(sec=>{
    html += '<h2>'+sec.num+'　'+sec.title+'</h2>';
    sec.items.forEach(it=>{
      html += '<div class="pq"><b>'+it.label+'</b><span>'+it.answer+'</span></div>';
    });
  });
  el.innerHTML = html;
}

async function generatePDF(){
  const btn = document.getElementById('genBtn');
  const status = document.getElementById('status');
  btn.disabled = true; status.textContent = '正在製作 PDF，請稍候…';
  try{
    const data = collect();
    buildPreview(data);
    await new Promise(r=>setTimeout(r,60));
    const el = document.getElementById('pdfPreview');
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff'});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = canvas.height * (imgW / canvas.width);
    let heightLeft = imgH, position = 0;
    const imgData = canvas.toDataURL('image/jpeg',0.95);
    pdf.addImage(imgData,'JPEG',0,position,imgW,imgH);
    heightLeft -= pageH;
    while(heightLeft > 0){
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData,'JPEG',0,position,imgW,imgH);
      heightLeft -= pageH;
    }
    const blob = pdf.output('blob');
    const hasClaudeDownloads = (typeof claude !== 'undefined') && claude && typeof claude.use === 'function';
    const downloads = hasClaudeDownloads ? await claude.use('downloads') : null;
    if(downloads){
      try{
        const res = await downloads.save({filename:'居家整理需求問卷.pdf', data: blob});
        status.textContent = res.status === 'saved' ? 'PDF 已下載完成。' : 'PDF 已送出。';
      }catch(err){
        if(err && err.code === 'declined'){ status.textContent = '已取消下載。'; }
        else{ status.textContent = '下載失敗（'+(err&&err.code||'未知錯誤')+'），請再試一次。'; }
      }
    }else{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = '居家整理需求問卷.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      status.textContent = 'PDF 已下載完成。';
    }
  }catch(e){
    status.textContent = '產生失敗，請再試一次。';
    console.error(e);
  }finally{
    btn.disabled = false;
  }
}
</script>
</body>
</html>
